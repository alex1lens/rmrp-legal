name: Daily RMRP Legal database
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-ios-database.yml'
      - 'ios/import-forum.py'
      - 'ios/Sources/RMRPLegal/Registry.json'
      - 'ios/Sources/RMRPLegal/Supplemental.json'

permissions:
  contents: write
concurrency:
  group: rmrp-ios-database
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate official documents
        run: python3 ios/import-forum.py ios data/articles.json
      - name: Publish changed database
        run: |
          git add data/articles.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Refresh RMRP Legal offline database"
          git push

